apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd
  namespace: {{ .Release.Namespace }}
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  # No tls block: the *.halitdincer.com wildcard (DNS-01) is nginx's default cert.
  # A per-host HTTP-01 cert can never renew on a Tailscale-only host.
  ingressClassName: nginx
  rules:
    - host: argocd.halitdincer.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 443
