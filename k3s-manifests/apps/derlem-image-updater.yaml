# ImageUpdater CR for derlem
# Watches the five ghcr.io/halitdincer/derlem-*:latest images by digest and writes each resolved digest into
# k3s-manifests/derlem/kustomization.yaml on main. The images are private: the registry is read with the
# derlem-ghcr pull secret below.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: derlem
  namespace: argocd
spec:
  namespace: argocd
  commonUpdateSettings:
    updateStrategy: digest
    pullSecret: pullsecret:argocd/derlem-ghcr
  applicationRefs:
    - namePattern: "derlem"
      images:
        - alias: users
          imageName: ghcr.io/halitdincer/derlem-users:latest
          manifestTargets:
            kustomize:
              name: ghcr.io/halitdincer/derlem-users
        - alias: corpus
          imageName: ghcr.io/halitdincer/derlem-corpus:latest
          manifestTargets:
            kustomize:
              name: ghcr.io/halitdincer/derlem-corpus
        - alias: media
          imageName: ghcr.io/halitdincer/derlem-media:latest
          manifestTargets:
            kustomize:
              name: ghcr.io/halitdincer/derlem-media
        - alias: backend
          imageName: ghcr.io/halitdincer/derlem-backend:latest
          manifestTargets:
            kustomize:
              name: ghcr.io/halitdincer/derlem-backend
        - alias: mcp
          imageName: ghcr.io/halitdincer/derlem-mcp:latest
          manifestTargets:
            kustomize:
              name: ghcr.io/halitdincer/derlem-mcp
  writeBackConfig:
    method: git
    gitConfig:
      branch: main
      writeBackTarget: "kustomization:."
---
# Registry credential the image updater reads the private derlem images with (Vault secret/derlem/ghcr, key `token`)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: derlem-ghcr
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: derlem-ghcr
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        # the image updater (unlike the kubelet) needs `auth`: base64 of user:token
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"halitdincer","password":"{{ .token }}","auth":"{{ printf "halitdincer:%s" .token | b64enc }}"}}}'
  data:
    - secretKey: token
      remoteRef:
        key: secret/derlem/ghcr
        property: token
