---
# The ingress's backend: an alias for the interceptor, which lives in the keda namespace
apiVersion: v1
kind: Service
metadata:
  name: keda-interceptor
spec:
  type: ExternalName
  externalName: keda-add-ons-http-interceptor-proxy.keda.svc.cluster.local
  ports:
    - name: http
      port: 8080
