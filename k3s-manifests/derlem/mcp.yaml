# The MCP server, at https://mentorbridge.org/mcp behind the same Access application
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  labels:
    app: mcp
spec:
  # No replicas: KEDA scales it between 0 and 1 (scale-to-zero.yaml)
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: mcp
  template:
    metadata:
      labels:
        app: mcp
    spec:
      imagePullSecrets:
        - name: ghcr-pull # the derlem repo and its packages are private
      terminationGracePeriodSeconds: 30
      # Everything wakes at once, so wait for the services this one calls: a request answered before they are up fails
      initContainers:
        - name: wait-for-services
          image: ghcr.io/halitdincer/derlem-mcp
          command:
            - python
            - -c
            - |
              import time, urllib.request
              for host in ("corpus:8200", "backend:8300"):
                  while True:
                      try:
                          urllib.request.urlopen(f"http://{host}/health", timeout=1)
                          break
                      except Exception:
                          time.sleep(0.25)
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      containers:
        - name: mcp
          image: ghcr.io/halitdincer/derlem-mcp
          ports:
            - name: http
              containerPort: 8400
          env:
            - name: SENTRY_ENVIRONMENT
              value: production
            - name: SENTRY_DSN # Bugsink project derlem-services; each event is tagged with its service
              valueFrom: { secretKeyRef: { name: derlem-secret, key: SENTRY_DSN } }
            - name: DERLEM_CORPUS_URL
              value: http://corpus:8200
            - name: DERLEM_APP_URL
              value: http://backend:8300
            - name: DERLEM_PUBLIC_HOST
              value: mentorbridge.org
            - name: DERLEM_ACCESS_TEAM_DOMAIN
              valueFrom: { secretKeyRef: { name: derlem-secret, key: ACCESS_TEAM_DOMAIN } }
            - name: DERLEM_ACCESS_AUDIENCES
              valueFrom: { secretKeyRef: { name: derlem-secret, key: ACCESS_AUD } }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 1
            failureThreshold: 120
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 1
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mcp
  labels:
    app: mcp
spec:
  selector:
    app: mcp
  ports:
    - name: http
      port: 8400
      targetPort: http
