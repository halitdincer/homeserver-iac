# Pull credential for the private ghcr.io/halitdincer/derlem-* images, from Vault (secret/derlem/ghcr, key `token`: a token with read:packages)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ghcr-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"halitdincer","password":"{{ .token }}"}}}'
  data:
    - secretKey: token
      remoteRef:
        key: secret/derlem/ghcr
        property: token
