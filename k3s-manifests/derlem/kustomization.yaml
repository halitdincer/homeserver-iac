apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - external-secret.yaml
  - ghcr-pull-external-secret.yaml
  - postgres.yaml
  - users.yaml
  - corpus.yaml
  - media.yaml
  - backend.yaml
  - mcp.yaml
  - web.yaml
  - scale-to-zero.yaml
# The version of each image running: released versions only, pinned by the derlem repo's deploy workflow (`just deploy`
# there), which commits here; ArgoCD rolls them out
images:
  - name: ghcr.io/halitdincer/derlem-users
    newTag: "1.0.1"
  - name: ghcr.io/halitdincer/derlem-corpus
    newTag: "2.1.1"
  - name: ghcr.io/halitdincer/derlem-media
    newTag: "2.0.1"
  - name: ghcr.io/halitdincer/derlem-backend
    newTag: "2.1.2"
  - name: ghcr.io/halitdincer/derlem-mcp
    newTag: "2.1.1"
  - name: ghcr.io/halitdincer/derlem-web
    newTag: "2.2.0"
