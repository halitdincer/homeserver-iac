# The corpus API (DTS) and search, over the Release Index files on the node
apiVersion: apps/v1
kind: Deployment
metadata:
  name: corpus
  labels:
    app: corpus
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    # the node's memory requests are nearly all given out: a second corpus pod (384Mi) would not fit beside the
    # first, so a deploy stops the old one before starting the new (a few seconds without search)
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector:
    matchLabels:
      app: corpus
  template:
    metadata:
      labels:
        app: corpus
    spec:
      imagePullSecrets:
        - name: ghcr-pull # the derlem repo and its packages are private
      terminationGracePeriodSeconds: 30
      containers:
        - name: corpus
          image: ghcr.io/halitdincer/derlem-corpus
          ports:
            - name: http
              containerPort: 8200
          env:
            - name: SENTRY_ENVIRONMENT
              value: production
            - name: SENTRY_DSN # Bugsink project derlem-services; each event is tagged with its service
              valueFrom: { secretKeyRef: { name: derlem-secret, key: SENTRY_DSN } }
            - name: DERLEM_CORPUS_RELEASES
              value: /data/releases
            - name: DERLEM_USERS_URL
              value: http://users:8100
            - name: DERLEM_ACCESS_TEAM_DOMAIN
              valueFrom: { secretKeyRef: { name: derlem-secret, key: ACCESS_TEAM_DOMAIN } }
            - name: DERLEM_ACCESS_AUDIENCES
              valueFrom: { secretKeyRef: { name: derlem-secret, key: ACCESS_AUD } }
          volumeMounts:
            - name: data
              mountPath: /data/releases
              readOnly: true
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              # above its ~285Mi working set, so under node memory pressure the kubelet evicts pods using more than
              # they asked for before this one
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
      volumes:
        - name: data
          # loaded onto the node by hand (docs/OPERATIONS.md, derlem): the Release Index files
          hostPath:
            path: /srv/derlem/releases
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: corpus
  labels:
    app: corpus
spec:
  selector:
    app: corpus
  ports:
    - name: http
      port: 8200
      targetPort: http
