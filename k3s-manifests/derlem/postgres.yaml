# Postgres for derlem: one database per service that keeps state (`users`, `app`); each service migrates its own on start.
apiVersion: v1
kind: ConfigMap
metadata:
  name: derlem-db-init
data:
  init.sql: |
    create database users;
    create database app;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: derlem-db
  labels:
    app: derlem-db
spec:
  serviceName: derlem-db
  replicas: 1
  selector:
    matchLabels:
      app: derlem-db
  template:
    metadata:
      labels:
        app: derlem-db
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          args:
            # the k3s VM is short of memory: keep Postgres modest (the data is people's Collections and Highlights, small)
            - -c
            - shared_buffers=64MB
            - -c
            - work_mem=4MB
            - -c
            - max_connections=50
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: derlem
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: derlem-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "derlem"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: init
          configMap:
            name: derlem-db-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: derlem-db
spec:
  selector:
    app: derlem-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
