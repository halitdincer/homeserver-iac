apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: derlem-secret
  annotations:
    # Block Postgres and the services until the Secret materializes.
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: derlem-secret
  dataFrom:
    # keys: POSTGRES_PASSWORD, ACCESS_TEAM_DOMAIN (<team>.cloudflareaccess.com), ACCESS_AUD (the Access application's audience tag)
    - extract:
        key: secret/derlem/config
