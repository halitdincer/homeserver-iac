# The app backend: the web app's API (/api; database `app`)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  # No replicas: KEDA scales it between 0 and 1 (scale-to-zero.yaml)
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull # the derlem repo and its packages are private
      terminationGracePeriodSeconds: 30
      # Everything wakes at once, so wait for the services this one calls: a request answered before they are up fails
      initContainers:
        - name: wait-for-services
          image: ghcr.io/halitdincer/derlem-backend
          command:
            - python
            - -c
            - |
              import time, urllib.request
              for host in ("users:8100", "corpus:8200", "media:8500"):
                  while True:
                      try:
                          urllib.request.urlopen(f"http://{host}/health", timeout=1)
                          break
                      except Exception:
                          time.sleep(0.25)
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      containers:
        - name: backend
          image: ghcr.io/halitdincer/derlem-backend
          ports:
            - name: http
              containerPort: 8300
          env:
            - name: SENTRY_ENVIRONMENT
              value: production
            - name: SENTRY_DSN # Bugsink project derlem-services; each event is tagged with its service
              valueFrom: { secretKeyRef: { name: derlem-secret, key: SENTRY_DSN } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: derlem-secret, key: POSTGRES_PASSWORD } }
            - name: DERLEM_APP_DATABASE_URL
              value: postgresql://derlem:$(POSTGRES_PASSWORD)@derlem-db:5432/app
            - name: DERLEM_USERS_URL
              value: http://users:8100
            - name: DERLEM_CORPUS_URL
              value: http://corpus:8200
            - name: DERLEM_MEDIA_URL
              value: http://media:8500
            - name: DERLEM_ACCESS_TEAM_DOMAIN
              valueFrom: { secretKeyRef: { name: derlem-secret, key: ACCESS_TEAM_DOMAIN } }
            - name: DERLEM_ACCESS_AUDIENCES
              valueFrom: { secretKeyRef: { name: derlem-secret, key: ACCESS_AUD } }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 1
            failureThreshold: 120
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 1
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8300
      targetPort: http
