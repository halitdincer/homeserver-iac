apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bugsink-secret
  annotations:
    # Block the Deployment until the Secret materializes.
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: bugsink-secret
  dataFrom:
    # keys: SECRET_KEY (50+ random chars), CREATE_SUPERUSER (email:password, used only on first start)
    - extract:
        key: secret/bugsink/config
