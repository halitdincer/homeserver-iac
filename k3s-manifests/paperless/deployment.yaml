apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  labels:
    app: paperless
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paperless
  template:
    metadata:
      labels:
        app: paperless
    spec:
      # The Service is named "paperless", so service links would inject
      # PAPERLESS_PORT=tcp://... and break Paperless's own PAPERLESS_PORT setting.
      enableServiceLinks: false
      containers:
        - name: paperless
          image: ghcr.io/paperless-ngx/paperless-ngx:3.5.1
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: paperless-secret
          env:
            - name: PAPERLESS_URL
              value: https://paperless.halitdincer.com
            # TLS terminates at nginx-ingress
            - name: PAPERLESS_PROXY_SSL_HEADER
              value: '["HTTP_X_FORWARDED_PROTO", "https"]'
            - name: PAPERLESS_REDIS
              value: redis://localhost:6379
            - name: PAPERLESS_DBENGINE
              value: sqlite
            - name: PAPERLESS_TIME_ZONE
              value: America/Toronto
            - name: PAPERLESS_OCR_LANGUAGE
              value: eng+tur
            - name: PAPERLESS_OCR_LANGUAGES
              value: tur
            # Single node with little headroom: keep worker counts low
            - name: PAPERLESS_WEBSERVER_WORKERS
              value: "1"
            - name: PAPERLESS_TASK_WORKERS
              value: "1"
            - name: PAPERLESS_THREADS_PER_WORKER
              value: "2"
            - name: PAPERLESS_CONSUMER_RECURSIVE
              value: "true"
            - name: PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
            - name: media
              mountPath: /usr/src/paperless/media
            - name: consume
              mountPath: /usr/src/paperless/consume
            - name: export
              mountPath: /usr/src/paperless/export
          startupProbe:
            httpGet:
              path: /
              port: http
              # PAPERLESS_URL pins ALLOWED_HOSTS; probes by pod IP get a 400
              httpHeaders:
                - name: Host
                  value: paperless.halitdincer.com
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
              # PAPERLESS_URL pins ALLOWED_HOSTS; probes by pod IP get a 400
              httpHeaders:
                - name: Host
                  value: paperless.halitdincer.com
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
              # PAPERLESS_URL pins ALLOWED_HOSTS; probes by pod IP get a 400
              httpHeaders:
                - name: Host
                  value: paperless.halitdincer.com
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2560Mi
        # Task queue broker only (no persistent state worth keeping)
        - name: broker
          image: docker.io/valkey/valkey:9-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-data
        - name: media
          persistentVolumeClaim:
            claimName: paperless-media
        - name: consume
          persistentVolumeClaim:
            claimName: paperless-consume
        - name: export
          persistentVolumeClaim:
            claimName: paperless-export
