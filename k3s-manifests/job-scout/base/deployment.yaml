apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-scout
  labels:
    app: job-scout
spec:
  # No `replicas:` in production: the HTTPScaledObject (overlays/production)
  # owns it and scales to zero when idle. Previews have no HTTPScaledObject,
  # so there it defaults to 1.
  selector:
    matchLabels:
      app: job-scout
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: job-scout
    spec:
      serviceAccountName: job-scout
      containers:
        - name: job-scout
          image: ghcr.io/halitdincer/job-scout:latest
          # The digest is pinned by kustomize, so a cached copy is always the
          # right one; Always would hit ghcr.io on every wake from zero.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              value: jdbc:postgresql://postgres:5432/jobscout
            - name: DATABASE_USER
              value: postgres
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: job-scout-secret
                  key: POSTGRES_PASSWORD
            - name: INGEST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: job-scout-secret
                  key: INGEST_API_KEY
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          # Probed every 2s: when scaled to zero the first request is held
          # until this passes, so a slow probe is a slow page load.
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            # No CPU limit (homelab convention): JVM startup is CPU-bound, and
            # at 500m it took 80s, longer than the KEDA interceptor will hold
            # a request while waking the app from zero.
            limits:
              memory: 512Mi
