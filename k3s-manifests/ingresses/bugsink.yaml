# Bugsink - error tracking
# Domain: bugsink.mentorbridge.org
# Public on purpose: browsers send errors here (guarded by each project's DSN key); the UI has its own login.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bugsink
  namespace: bugsink
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # event envelopes and source map uploads exceed nginx's 1m default
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - host: bugsink.mentorbridge.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bugsink
                port:
                  name: http
