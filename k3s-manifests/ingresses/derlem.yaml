# derlem - the library platform: the web app, its API at /api and the MCP server at /mcp, replacing rahle
# Domain: mentorbridge.org (temporary), behind the Cloudflare Access application "derlem"; the tunnel routes the
# hostname to nginx (a public hostname on the remotely managed tunnel, as it is not under *.halitdincer.com)
# Every path goes to the KEDA interceptor, which wakes derlem if it is asleep and routes /mcp, /api and the rest to
# mcp, backend and web (k3s-manifests/derlem/scale-to-zero.yaml)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: derlem
  namespace: derlem
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
spec:
  ingressClassName: nginx
  rules:
    - host: mentorbridge.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keda-interceptor
                port:
                  number: 8080
