# derlem - the library platform (web app, its API, and the MCP server at /mcp), replacing rahle
# Domain: mentorbridge.org (temporary), behind the Cloudflare Access application "derlem"; the tunnel routes the
# hostname to nginx (a public hostname on the remotely managed tunnel, as it is not under *.halitdincer.com)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: derlem
  namespace: derlem
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
spec:
  ingressClassName: nginx
  rules:
    - host: mentorbridge.org
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: mcp
                port:
                  number: 8400
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8300
