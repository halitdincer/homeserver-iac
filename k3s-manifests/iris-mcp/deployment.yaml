apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-mcp
  labels:
    app: iris-mcp
spec:
  replicas: 1
  # The OAuth state volume is ReadWriteOnce.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: iris-mcp
  template:
    metadata:
      labels:
        app: iris-mcp
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: iris-mcp
          image: ghcr.io/halitdincer/iris-mcp:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: IRIS_MCP_LOG_LEVEL
              value: info
            - name: IRIS_MCP_UPSTREAM_BASE_URL
              value: http://iris.iris.svc.cluster.local:8000
            - name: IRIS_MCP_RATE_LIMIT
              value: 60/minute
            - name: IRIS_MCP_BEARER
              valueFrom:
                secretKeyRef:
                  name: iris-mcp-secret
                  key: MCP_BEARER
            - name: IRIS_MCP_UPSTREAM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: iris-mcp-secret
                  key: MCP_UPSTREAM_TOKEN
            # OAuth (GitHub) for Claude.ai / ChatGPT connectors. Off until the
            # GitHub OAuth App credentials exist in Vault; see iris docs/MCP.md.
            - name: IRIS_MCP_PUBLIC_BASE_URL
              value: https://iris-mcp.halitdincer.com
            - name: IRIS_MCP_ALLOWED_GITHUB_LOGINS
              value: '["halitdincer"]'
            - name: FASTMCP_HOME
              value: /data/fastmcp
            - name: IRIS_MCP_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: iris-mcp-oauth
                  key: MCP_GITHUB_CLIENT_ID
                  optional: true
            - name: IRIS_MCP_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: iris-mcp-oauth
                  key: MCP_GITHUB_CLIENT_SECRET
                  optional: true
            - name: IRIS_MCP_OAUTH_JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: iris-mcp-oauth
                  key: MCP_OAUTH_JWT_SIGNING_KEY
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: iris-mcp-data
