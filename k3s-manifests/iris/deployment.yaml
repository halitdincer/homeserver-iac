apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris
  labels:
    app: iris
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: iris
  template:
    metadata:
      labels:
        app: iris
    spec:
      containers:
        - name: iris
          image: ghcr.io/halitdincer/iris:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: IRIS_ENV
              value: prod
            - name: IRIS_LOG_LEVEL
              value: info
            - name: IRIS_AUDIT_DB_PATH
              value: /data/audit.db
            - name: IRIS_LABELS_DB_PATH
              value: /data/labels.db
            # Reads go direct to Tesla; commands go through the signing
            # sidecar below on localhost. See iris docs/TESLA.md.
            - name: IRIS_TESLA_PROXY_BASE_URL
              value: https://127.0.0.1:4443
            - name: IRIS_TESLA_PUBLIC_KEY_PATH
              value: /tesla-keys/com.tesla.3p.public-key.pem
            - name: IRIS_TESLA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: iris-secret
                  key: TESLA_CLIENT_ID
                  optional: true
            - name: IRIS_TESLA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: iris-secret
                  key: TESLA_CLIENT_SECRET
                  optional: true
            - name: IRIS_TESLA_REFRESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: iris-secret
                  key: TESLA_REFRESH_TOKEN
                  optional: true
            - name: IRIS_TESLA_VIN
              valueFrom:
                secretKeyRef:
                  name: iris-secret
                  key: TESLA_VIN
                  optional: true
            - name: IRIS_STEPUP_CALLBACK_BASE_URL
              value: https://iris.halitdincer.com
            - name: IRIS_JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: iris-secret
                  key: JWT_SIGNING_KEY
            - name: IRIS_NTFY_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: iris-secret
                  key: NTFY_BASE_URL
            - name: IRIS_NTFY_TOPIC
              valueFrom:
                secretKeyRef:
                  name: iris-secret
                  key: NTFY_TOPIC
            - name: IRIS_NTFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: iris-secret
                  key: NTFY_TOKEN
            - name: IRIS_GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: iris-secret
                  key: GOOGLE_MAPS_API_KEY
                  optional: true
            - name: IRIS_HA_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: iris-secret
                  key: HA_BASE_URL
                  optional: true
            - name: IRIS_HA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: iris-secret
                  key: HA_TOKEN
                  optional: true
            - name: IRIS_HA_PHONE_TRACKER_ENTITY
              value: person.halit
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tesla-keys
              mountPath: /tesla-keys
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
        # ------------------------------------------------------------------
        # Tesla Vehicle Command signing proxy.
        #
        # Every Tesla built after ~2021 rejects unsigned commands, so unlock /
        # navigate / climate must be signed with the private half of the key
        # whose public half is served at
        # https://iris.halitdincer.com/.well-known/appspecific/com.tesla.3p.public-key.pem
        #
        # The proxy listens on loopback only — it is reachable from the iris
        # container in the same pod and from nowhere else. It holds the private
        # key; iris never sees it.
        #
        # VERIFY BEFORE FIRST DEPLOY: image tag and flag names track the
        # upstream teslamotors/vehicle-command release you pin. A wrong flag
        # here fails closed (commands 502), it does not fail silently.
        # ------------------------------------------------------------------
        - name: tesla-http-proxy
          image: ghcr.io/teslamotors/vehicle-command/tesla-http-proxy:latest
          imagePullPolicy: IfNotPresent
          args:
            - -host=127.0.0.1
            - -port=4443
            - -key-file=/tesla-keys/private-key.pem
            - -cert=/tesla-proxy-tls/tls.crt
            - -tls-key=/tesla-proxy-tls/tls.key
            - -verbose
          ports:
            - name: tesla-proxy
              containerPort: 4443
          volumeMounts:
            - name: tesla-keys
              mountPath: /tesla-keys
              readOnly: true
            - name: tesla-proxy-tls
              mountPath: /tesla-proxy-tls
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: iris-data
        # Vehicle Command keypair. Created out of band — see iris docs/TESLA.md.
        # NOT managed by External Secrets: the private key never goes to Vault's
        # generic config path, so it cannot leak into the app container's env.
        - name: tesla-keys
          secret:
            secretName: iris-tesla-keys
            optional: true
        # Self-signed TLS for the loopback proxy listener.
        - name: tesla-proxy-tls
          secret:
            secretName: iris-tesla-proxy-tls
            optional: true
